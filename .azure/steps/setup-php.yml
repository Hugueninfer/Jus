steps:
  - script: |
      set -euo pipefail
      sudo add-apt-repository -y ppa:ondrej/php
      sudo apt-get update
      sudo apt-get install -y php8.4-cli php8.4-intl php8.4-sqlite3 php8.4-mbstring php8.4-xml php8.4-curl php8.4-zip php8.4-pcov
      sudo update-alternatives --set php /usr/bin/php8.4
      php -v
    displayName: Install PHP 8.4

  - task: Cache@2
    displayName: Cache Composer downloads
    inputs:
      key: 'composer | "$(Agent.OS)" | composer.lock'
      restoreKeys: |
        composer | "$(Agent.OS)"
      path: $(COMPOSER_CACHE_DIR)

  - script: composer install --no-interaction --no-progress --prefer-dist
    displayName: composer install
