trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  COMPOSER_CACHE_DIR: $(Pipeline.Workspace)/.composer

stages:
  - stage: Quality
    jobs:
      - job: php_quality
        displayName: PHP quality
        steps:
          - template: .azure/steps/setup-php.yml
          - script: composer validate --strict
            displayName: composer validate
          - script: composer cs
            displayName: PHP-CS-Fixer
          - script: composer lint
            displayName: Symfony and Doctrine lints
          - script: composer stan
            displayName: PHPStan

      - job: frontend_quality
        displayName: Front-end quality
        steps:
          - task: NodeTool@0
            displayName: Install Node.js 24
            inputs:
              versionSpec: '24.x'
          - script: npm ci
            displayName: npm ci
          - script: npm run ci:quality
            displayName: ESLint, Stylelint, tsc and production build

  - stage: Test
    dependsOn: Quality
    jobs:
      - job: phpunit
        displayName: PHPUnit
        steps:
          - template: .azure/steps/setup-php.yml
          - script: composer test:coverage
            displayName: PHPUnit with coverage
          - script: composer coverage:domain
            displayName: Domain coverage must be 100%

      - job: web_components
        displayName: Web Components
        steps:
          - task: NodeTool@0
            displayName: Install Node.js 24
            inputs:
              versionSpec: '24.x'
          - script: npm ci
            displayName: npm ci
          - script: npx playwright install --with-deps chromium
            displayName: Install Playwright Chromium
          - script: npm test
            displayName: Vitest in the browser (axe-core included)
